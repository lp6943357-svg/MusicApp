<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MusicApp</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#080808;color:#fff}.app{max-width:480px;min-height:100vh;margin:auto;background:#101010;padding-bottom:150px}header{padding:25px 20px}header h1{font-size:28px}header h1 span{color:#8b5cf6}header p{color:#777;margin-top:5px;font-size:13px}main{padding:0 20px}.page{display:none}.page.active{display:block}.search{display:flex;align-items:center;gap:10px;background:#1b1b1b;border:1px solid #292929;border-radius:14px;padding:0 15px;height:50px}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px}.search input::placeholder{color:#777}h2{margin-top:25px;margin-bottom:15px;font-size:19px}.categories{display:flex;gap:8px;overflow-x:auto}.categories button{flex-shrink:0;background:#1b1b1b;color:#ddd;border:1px solid #292929;padding:9px 14px;border-radius:12px}.music{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222}.cover{width:52px;height:52px;flex-shrink:0;background:#292929;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;overflow:hidden}.music-info{flex:1;min-width:0}.music-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-info span{display:block;color:#777;font-size:13px;margin-top:5px}.source{font-size:10px!important;color:#666!important;margin-top:3px!important}.download,.delete{width:40px;height:40px;flex-shrink:0;border:0;border-radius:50%;background:#1b1b1b;color:#aaa;font-size:17px}.download:active,.delete:active{transform:scale(.9)}.download.ok{color:#63e6be}.download[disabled]{opacity:.65}.download.blocked{opacity:.35;cursor:not-allowed}.delete{color:#ff6b6b}.status{font-size:12px;color:#777;margin:12px 0}.empty{text-align:center;color:#777;padding:60px 20px}.empty div{font-size:40px;margin-bottom:15px}.empty h3{color:#ddd;margin-bottom:8px}.player{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;background:#1b1b1b;border:1px solid #303030;border-radius:15px;padding:10px;display:flex;align-items:center;justify-content:space-between;z-index:10}.player-info{display:flex;align-items:center;gap:10px;min-width:0}.mini-cover{width:42px;height:42px;background:#292929;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.player-text{min-width:0}.player-text strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-text span{display:block;color:#777;font-size:11px;margin-top:3px}#playButton{width:40px;height:40px;border:0;border-radius:50%;background:#8b5cf6;color:#fff;font-size:16px}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:65px;background:#111;border-top:1px solid #222;display:flex;z-index:20}.nav{flex:1;border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav.active{color:#8b5cf6}.nav span{font-size:19px}.nav small{font-size:11px}
</style>
</head>
<body>
<div class="app">
<header><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>Music<span>App</span></h1><p>Pesquise, baixe e ouça offline.</p></div><button id="accountButton" onclick="abrirAuth()" style="border:1px solid #333;background:#1b1b1b;color:#fff;border-radius:12px;padding:9px 12px">Entrar</button></div></header>
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:380px;background:#181818;border:1px solid #333;border-radius:18px;padding:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="margin:0">Sua conta</h2><button onclick="fecharAuth()" style="border:0;background:transparent;color:#aaa;font-size:24px">×</button></div>
    <input id="authEmail" type="email" placeholder="Seu e-mail" style="width:100%;height:48px;margin-bottom:10px;padding:0 14px;border-radius:12px;border:1px solid #333;background:#101010;color:#fff;outline:0">
    <input id="authPassword" type="password" placeholder="Senha" style="width:100%;height:48px;margin-bottom:12px;padding:0 14px;border-radius:12px;border:1px solid #333;background:#101010;color:#fff;outline:0">
    <button onclick="entrarConta()" style="width:100%;height:46px;border:0;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:700;margin-bottom:8px">Entrar</button>
    <button onclick="criarConta()" style="width:100%;height:46px;border:1px solid #444;border-radius:12px;background:#222;color:#fff;font-weight:700">Criar conta</button>
    <p id="authStatus" style="color:#888;font-size:12px;margin-top:12px;text-align:center"></p>
  </div>
</div>
<main>
<section id="home" class="page active">
<div class="search">🔍<input id="searchInput" type="search" placeholder="Pesquisar músicas..." autocomplete="off"><button id="searchButton" type="button" style="border:0;background:#8b5cf6;color:#fff;border-radius:10px;height:36px;padding:0 12px;font-weight:700">Buscar</button></div>
<h2>Descobrir</h2>
<div class="categories">
<button onclick="descobrir('')">🎵 Todas</button>
<button onclick="descobrir('trending')">🔥 Hits</button>
<button onclick="descobrir('rock')">🎸 Rock</button>
<button onclick="descobrir('rap')">🎧 Rap</button>
<button onclick="descobrir('pop')">💜 Pop</button>
</div>
<h2>Músicas</h2><div id="songs"></div>
</section>
<section id="downloads" class="page"><h2>📥 Minhas músicas</h2><div id="downloadList"></div></section>
</main>
<div class="player"><div class="player-info"><div class="mini-cover" id="miniCover">🎵</div><div class="player-text"><strong id="songName">Nenhuma música</strong><span id="artistName">Escolha uma música</span></div></div><button id="playButton">▶</button></div>
<nav class="bottom-nav"><button class="nav active" onclick="abrirPagina('home',this)"><span>🔍</span><small>Pesquisar</small></button><button class="nav" onclick="abrirPagina('downloads',this)"><span>📥</span><small>Baixadas</small></button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{try{for(const k of await caches.keys()){if(k.startsWith("musicapp-v2")||k.startsWith("musicapp-v3"))await caches.delete(k)}}catch(e){}})();

const SUPABASE_URL="https://ekhwgjsmlmbortsczdit.supabase.co";
const SUPABASE_KEY="sb_publishable_vK92HofJy2bBUWV-laqVgg_b-SWaI9N";
let supabaseClient=null; try{ if(window.supabase?.createClient) supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ console.warn("Conta indisponível:",e); }
let currentUser=null;
function downloadsKey(){return currentUser?"musicapp_downloads_"+currentUser.id:"musicapp_downloads_guest"}
function abrirAuth(){document.getElementById("authModal").style.display="flex";document.getElementById("authStatus").textContent=currentUser?("Conectado como "+(currentUser.email||"usuário")):""}
function fecharAuth(){document.getElementById("authModal").style.display="none"}
function authMsg(msg){document.getElementById("authStatus").textContent=msg}
async function entrarConta(){
  if(!supabaseClient){authMsg("Login temporariamente indisponível. A pesquisa e o player continuam funcionando.");return}
  const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;
  if(!email||!password){authMsg("Preencha e-mail e senha.");return}
  authMsg("Entrando...");
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){authMsg(error.message);return}
  fecharAuth();
}
async function criarConta(){
  if(!supabaseClient){authMsg("Cadastro temporariamente indisponível. A pesquisa e o player continuam funcionando.");return}
  const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;
  if(!email||password.length<6){authMsg("Use um e-mail e uma senha com pelo menos 6 caracteres.");return}
  authMsg("Criando conta...");
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){authMsg(error.message);return}
  if(data.session){fecharAuth()}else authMsg("Conta criada. Verifique seu e-mail se for solicitado e depois entre.");
}
async function sairConta(){if(supabaseClient)await supabaseClient.auth.signOut()}
function atualizarConta(){
  const b=document.getElementById("accountButton");
  if(!b)return;
  b.textContent=currentUser?"Sair / Conta":"Entrar";
  b.onclick=currentUser?sairOuConta:abrirAuth;
}
async function sairOuConta(){
  if(confirm("Sair da conta?")){await sairConta();location.reload()}
}
if(supabaseClient) supabaseClient.auth.onAuthStateChange((_event,session)=>{
  currentUser=session?.user||null;
  atualizarConta();
  if(typeof mostrarBiblioteca==="function")mostrarBiblioteca();
});

const demoMusicas=[{id:"summer-nights",title:"Summer Nights",artist:"Artist One",file:"music/teste.mp3",cover:"🎵",downloadAllowed:true},{id:"midnight-drive",title:"Midnight Drive",artist:"Artist Two",file:"music/midnight-drive.mp3",cover:"🎶",downloadAllowed:true},{id:"lost-city",title:"Lost In The City",artist:"Artist Three",file:"music/lost-in-the-city.mp3",cover:"🎧",downloadAllowed:true}];
const audio=new Audio();audio.preload="metadata";let currentSong=null;
const playButton=document.getElementById("playButton"),songName=document.getElementById("songName"),artistName=document.getElementById("artistName"),miniCover=document.getElementById("miniCover"),songsBox=document.getElementById("songs");
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function isDownloaded(id){return JSON.parse(localStorage.getItem(downloadsKey())||"[]").some(x=>x.id===id)}
function coverHtml(song,mini=false){return song.cover&&/^https?:/i.test(song.cover)?'<img src="'+escapeHtml(song.cover)+'" style="width:100%;height:100%;object-fit:cover;border-radius:'+(mini?"10":"12")+'px">':(song.cover||"🎵")}
function renderSongs(list){songsBox.innerHTML="";if(!list.length){songsBox.innerHTML='<div class="empty"><div>🔎</div><h3>Nada encontrado</h3><p>Pesquise outro nome ou artista.</p></div>';return}list.forEach(song=>{const el=document.createElement("div");el.className="music";const downloaded=isDownloaded(song.id);const allowed=song.downloadAllowed===true;el.innerHTML='<div class="cover">'+coverHtml(song)+'</div><div class="music-info"><strong>'+escapeHtml(song.title)+'</strong><span>'+escapeHtml(song.artist)+'</span><span class="source">'+escapeHtml(song.source||"MusicApp")+'</span></div><button class="download '+(downloaded?"ok ":"")+(allowed?"":"blocked")+'" '+(allowed?"":"disabled title=\"Download não permitido para esta faixa\"")+'>'+(!allowed?"🔒":(downloaded?"✓":"⬇"))+'</button>';el.onclick=e=>{if(e.target.classList.contains("download")){if(allowed)baixar(song,el.querySelector(".download"))}else tocar(song)};songsBox.appendChild(el)})}
async function tocar(song){currentSong=song;songName.textContent=song.title;artistName.textContent=song.artist;miniCover.innerHTML=coverHtml(song,true);try{const cache=await caches.open("musicapp-audio-v2");const offlineFile=song.file||("/api/audio?id="+encodeURIComponent(song.audioId||song.id));const cached=await cache.match(offlineFile);audio.src=cached?URL.createObjectURL(await cached.blob()):offlineFile;await audio.play();playButton.textContent="⏸";configurarMediaSession()}catch(e){console.log(e);alert("Não foi possível reproduzir esta música. Se ela foi baixada, tente baixá-la novamente.")}}
playButton.onclick=async()=>{if(!currentSong)return;if(audio.paused){await audio.play();playButton.textContent="⏸"}else{audio.pause();playButton.textContent="▶"}};
audio.addEventListener("play",()=>playButton.textContent="⏸");audio.addEventListener("pause",()=>playButton.textContent="▶");audio.addEventListener("ended",()=>playButton.textContent="▶");
function configurarMediaSession(){if(!("mediaSession"in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:currentSong.title,artist:currentSong.artist,album:"MusicApp"});for(const action of ["play","pause","seekbackward","seekforward"]){try{navigator.mediaSession.setActionHandler(action,()=>{if(action==="play")audio.play();if(action==="pause")audio.pause();if(action==="seekbackward")audio.currentTime=Math.max(0,audio.currentTime-10);if(action==="seekforward")audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)})}catch(_){} }}
async function baixar(song,button){if(!currentUser){abrirAuth();return}if(song.downloadAllowed!==true)return;button.disabled=true;button.textContent="…";try{const response=await fetch("/api/audio?id="+encodeURIComponent(song.audioId||song.id)+"&mode=download");if(!response.ok)throw new Error();const cache=await caches.open("musicapp-audio-v2");await cache.put(song.file,response.clone());const list=JSON.parse(localStorage.getItem(downloadsKey())||"[]");if(!list.some(x=>x.id===song.id)){list.push(song);localStorage.setItem(downloadsKey(),JSON.stringify(list))}button.textContent="✓";button.classList.add("ok");mostrarBiblioteca()}catch(e){button.textContent="!";alert("Não foi possível baixar esta música.");setTimeout(()=>button.textContent="⬇",1200)}finally{button.disabled=false}}
async function buscar(q){q=q.trim();if(!q){renderSongs(demoMusicas);return}songsBox.innerHTML='<div class="empty"><div>⏳</div><h3>Pesquisando...</h3><p>Buscando no catálogo.</p></div>';try{const r=await fetch("/api/search?q="+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw new Error(data.error||"Erro");renderSongs(data.results)}catch(e){songsBox.innerHTML='<div class="empty"><div>⚠️</div><h3>Pesquisa indisponível</h3><p>'+escapeHtml(e.message)+'</p></div>'}}
async function descobrir(termo){
  abrirPagina("home",document.querySelector('.nav'));
  if(!termo){renderSongs(demoMusicas);return}
  document.getElementById("searchInput").value="";
  await buscar(termo);
}
let searchTimer;const searchInput=document.getElementById("searchInput");const searchButton=document.getElementById("searchButton");function executarBusca(){clearTimeout(searchTimer);buscar(searchInput.value)}searchInput.addEventListener("input",function(){clearTimeout(searchTimer);if(this.value.trim().length>=2)searchTimer=setTimeout(()=>buscar(this.value),500)});searchInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();executarBusca()}});searchButton.addEventListener("click",executarBusca);
function mostrarBiblioteca(){const lista=document.getElementById("downloadList"),b=JSON.parse(localStorage.getItem(downloadsKey())||"[]");lista.innerHTML="";if(!b.length){lista.innerHTML='<div class="empty"><div>📥</div><h3>Nenhuma música baixada</h3><p>Pesquise e baixe músicas para ouvir offline.</p></div>';return}b.forEach((item,index)=>{const el=document.createElement("div");el.className="music";el.innerHTML='<div class="cover">'+coverHtml(item)+'</div><div class="music-info"><strong>'+escapeHtml(item.title)+'</strong><span>'+escapeHtml(item.artist)+'</span></div><button class="delete">✕</button>';el.onclick=e=>{if(!e.target.classList.contains("delete"))tocar(item)};el.querySelector(".delete").onclick=async e=>{e.stopPropagation();try{const cache=await caches.open("musicapp-audio-v2");const url=item.file||("/api/audio?id="+encodeURIComponent(item.audioId||item.id));await cache.delete(url)}catch(_){}b.splice(index,1);localStorage.setItem(downloadsKey(),JSON.stringify(b));mostrarBiblioteca()};lista.appendChild(el)})}
function abrirPagina(pagina,botao){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(pagina).classList.add("active");document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));botao.classList.add("active");if(pagina==="downloads")mostrarBiblioteca();window.scrollTo({top:0,behavior:"smooth"})}
renderSongs(demoMusicas);mostrarBiblioteca();atualizarConta();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(console.log);
</script>
</body></html>
